  <rect x="112" y="200" width="10" height="10" rx="2.5" fill="#a8dadc" />
  <path d="M114.5 205.5l2 2 4-4.5" stroke="white" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none" />
