<svg viewBox="0 0 400 260" fill="none" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
  <rect width="400" height="260" fill="#edf7f7" />

  <!-- Central avatar — solo founder -->
  <circle cx="200" cy="80" r="30" fill="#1d3557" />
  <circle cx="200" cy="72" r="11" fill="#edf7f7" />
  <path d="M180 98a20 20 0 0 1 40 0" fill="#edf7f7" />

  <!-- Role badges radiating around the founder -->

