<svg width="700" height="400" viewBox="0 0 700 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="topHalf">
      <rect x="0" y="0" width="700" height="200" />
    </clipPath>
    <clipPath id="bottomHalf">
      <rect x="0" y="200" width="700" height="200" />
    </clipPath>
  </defs>

  <!-- Two background halves -->
  <rect x="0" y="0" width="700" height="200" fill="#F8FCFD" />
  <rect x="0" y="200" width="700" height="200" fill="#EDF5F7" />

  <!-- Soft decorative circles -->
  <circle cx="620" cy="60" r="100" fill="white" fill-opacity="0.5" />
  <circle cx="80" cy="340" r="110" fill="#DCEEF3" fill-opacity="0.45" />

  <!-- Top: Proceed to Planning button -->
  <g clip-path="url(#topHalf)">
    <rect x="130" y="52" width="440" height="80" rx="18" fill="#1D3557" />
    <text x="350" y="102" text-anchor="middle" fill="white" font-size="28" font-weight="700" font-family="Manrope, Segoe UI, sans-serif">Proceed to Planning</text>

    <!-- Pointer cursor at right-bottom of button -->
    <g transform="translate(546 114) scale(1.6)">
      <path d="M0 0L0 22L5.5 17L9.5 26L13 24.5L9 16L16 16Z" fill="#1D3557" stroke="#9CB8C3" stroke-width="2" stroke-linejoin="round" />
    </g>
  </g>

  <!-- Bottom: Proceed to Working button -->
  <g clip-path="url(#bottomHalf)">
    <rect x="130" y="268" width="440" height="80" rx="18" fill="#1D3557" />
    <text x="350" y="318" text-anchor="middle" fill="white" font-size="28" font-weight="700" font-family="Manrope, Segoe UI, sans-serif">Proceed to Working</text>

    <!-- Pointer cursor at right-bottom of button -->
    <g transform="translate(546 330) scale(1.6)">
      <path d="M0 0L0 22L5.5 17L9.5 26L13 24.5L9 16L16 16Z" fill="#1D3557" stroke="#9CB8C3" stroke-width="2" stroke-linejoin="round" />
    </g>
  </g>
</svg>
