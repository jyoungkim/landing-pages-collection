<svg width="700" height="400" viewBox="0 0 700 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="topLeft">
      <polygon points="0,0 700,0 0,400" />
    </clipPath>
    <clipPath id="bottomRight">
      <polygon points="700,0 700,400 0,400" />
    </clipPath>
  </defs>

  <!-- Two background halves with subtle color difference -->
  <polygon points="0,0 700,0 0,400" fill="#F8FCFD" />
  <polygon points="700,0 700,400 0,400" fill="#EDF5F7" />

  <!-- Soft decorative circles -->
  <circle cx="80" cy="60" r="100" fill="white" fill-opacity="0.5" />
  <circle cx="620" cy="340" r="120" fill="#DCEEF3" fill-opacity="0.45" />

  <!-- Chat UI — top-left area, scaled up -->
  <g clip-path="url(#topLeft)">
    <g transform="translate(40 30)">
      <!-- Incoming message -->
      <rect x="0" y="0" width="280" height="68" rx="18" fill="white" stroke="#C8DCE3" stroke-width="1.5" />
      <rect x="22" y="20" width="170" height="10" rx="5" fill="#D7E7ED" />
      <rect x="22" y="38" width="110" height="9" rx="4.5" fill="#E4EFF3" />

      <!-- Outgoing message (user reply) -->
      <rect x="80" y="84" width="230" height="58" rx="18" fill="#1D3557" />
      <rect x="102" y="102" width="150" height="10" rx="5" fill="#A8DADC" fill-opacity="0.5" />
      <rect x="102" y="120" width="100" height="9" rx="4.5" fill="#A8DADC" fill-opacity="0.3" />

      <!-- Agent typing indicator -->
      <rect x="0" y="158" width="150" height="56" rx="18" fill="white" stroke="#C8DCE3" stroke-width="1.5" />
      <circle cx="38" cy="186" r="6" fill="#A8DADC" />
      <circle cx="58" cy="186" r="6" fill="#A8DADC" fill-opacity="0.55" />
      <circle cx="78" cy="186" r="6" fill="#A8DADC" fill-opacity="0.25" />

      <!-- Another incoming message -->
      <rect x="0" y="230" width="240" height="58" rx="18" fill="white" stroke="#C8DCE3" stroke-width="1.5" />
      <rect x="22" y="248" width="160" height="10" rx="5" fill="#D7E7ED" />
      <rect x="22" y="266" width="120" height="9" rx="4.5" fill="#E4EFF3" />
    </g>
  </g>

  <!-- Task card UI — bottom-right area -->
  <g clip-path="url(#bottomRight)">
    <g transform="translate(360 120)">
      <!-- Card -->
      <rect x="0" y="0" width="280" height="240" rx="18" fill="white" stroke="#C8DCE3" stroke-width="1.5" />

      <!-- Header bar -->
      <rect x="0" y="0" width="280" height="48" rx="18" fill="#1D3557" />
      <rect x="0" y="18" width="280" height="30" fill="#1D3557" />
      <circle cx="24" cy="24" r="5" fill="#A8DADC" />
      <rect x="42" y="19" width="90" height="10" rx="5" fill="#A8DADC" fill-opacity="0.4" />

      <!-- "Creating Task" label -->
      <text x="140" y="78" text-anchor="middle" fill="#1D3557" font-size="15" font-weight="700" font-family="Manrope, Segoe UI, sans-serif">Creating Task</text>

      <!-- Input field placeholders -->
      <rect x="24" y="96" width="232" height="12" rx="6" fill="#D7E7ED" />
      <rect x="24" y="122" width="232" height="12" rx="6" fill="#E4EFF3" />
      <rect x="24" y="148" width="180" height="12" rx="6" fill="#E4EFF3" />

      <!-- Create button -->
      <rect x="24" y="182" width="100" height="36" rx="10" fill="#1D3557" />
      <text x="74" y="205" text-anchor="middle" fill="#A8DADC" font-size="13" font-weight="600" font-family="Manrope, Segoe UI, sans-serif">Create</text>
    </g>
  </g>
</svg>
