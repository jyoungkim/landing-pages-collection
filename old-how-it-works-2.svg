<svg
                viewBox="0 0 340 130"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
              >
                <!-- Column headers -->
                <text
                  x="24"
                  y="18"
                  font-family="Manrope,sans-serif"
                  font-size="10"
                  font-weight="700"
                  letter-spacing="0.06em"
                  fill="#4b5563"
                >
                  BACKLOG
                </text>
                <line
                  x1="24"
                  y1="26"
                  x2="152"
                  y2="26"
                  stroke="#dbe7ea"
                  stroke-width="2"
                />
                <text
                  x="190"
                  y="18"
                  font-family="Manrope,sans-serif"
                  font-size="10"
                  font-weight="700"
                  letter-spacing="0.06em"
                  fill="#4b5563"
                >
                  WORKING
                </text>
                <line
                  x1="190"
                  y1="26"
                  x2="318"
                  y2="26"
                  stroke="#dbe7ea"
                  stroke-width="2"
                />
                <!-- Ghost outline where card was -->
                <rect
                  x="24"
                  y="36"
                  width="128"
                  height="76"
                  rx="8"
                  fill="none"
                  stroke="#dbe7ea"
                  stroke-dasharray="4 3"
                >
                  <animate
                    attributeName="opacity"
                    values="0;0;0.5;0.5;0"
                    keyTimes="0;0.20;0.38;0.80;0.95"
                    dur="6s"
                    repeatCount="indefinite"
                  />
                </rect>
                <!-- Card that slides from Backlog to Working -->
                <g>
                  <animateTransform
                    attributeName="transform"
                    type="translate"
                    values="0 0;0 0;166 0;166 0;0 0"
                    keyTimes="0;0.15;0.35;0.80;0.95"
                    dur="6s"
                    repeatCount="indefinite"
                  />
                  <rect
                    x="24"
                    y="36"
                    width="128"
                    height="76"
                    rx="8"
                    fill="#fff"
                    stroke="#dbe7ea"
                  />
                  <rect
                    x="34"
                    y="46"
                    width="58"
                    height="15"
                    rx="3"
                    fill="#edf7f7"
                  />
                  <text
                    x="40"
                    y="57"
                    font-family="Manrope,sans-serif"
                    font-size="8"
                    fill="#0f766e"
                    font-weight="700"
                  >
                    ⚡ AI Agent
                  </text>
                  <text
                    x="34"
                    y="78"
                    font-family="Manrope,sans-serif"
                    font-size="11"
                    fill="#111827"
                  >
                    Draft blog post
                  </text>
                  <!-- Progress bar -->
                  <rect
                    x="34"
                    y="96"
                    width="96"
                    height="3"
                    rx="1.5"
                    fill="#dbe7ea"
                  />
                  <rect
                    x="34"
                    y="96"
                    width="0"
                    height="3"
                    rx="1.5"
                    fill="#a8dadc"
                  >
                    <animate
                      attributeName="width"
                      values="0;0;0;72;72;0"
                      keyTimes="0;0.15;0.40;0.60;0.80;0.95"
                      dur="6s"
                      repeatCount="indefinite"
                    />
                  </rect>
                </g>
              </svg>