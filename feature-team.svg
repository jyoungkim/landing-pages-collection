<svg viewBox="0 0 400 260" fill="none" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
  <rect width="400" height="260" fill="#edf7f7" />

  <!-- Task card (expanded to include comments) -->
  <rect x="60" y="14" width="280" height="232" rx="10" fill="white" stroke="#c8dde0" stroke-width="1.2" />

  <!-- Card header bar -->
  <rect x="60" y="14" width="280" height="30" rx="10" fill="#1d3557" />
  <rect x="60" y="34" width="280" height="10" fill="#1d3557" />
  <!-- Status badge -->
  <rect x="76" y="24" width="52" height="12" rx="6" fill="#a8dadc" />
  <text x="102" y="32.5" fill="#1d3557" font-size="7" font-family="system-ui,sans-serif" font-weight="600" text-anchor="middle">Planning</text>
  <!-- Assignee avatars in header -->
  <circle cx="304" cy="30" r="8" fill="#a8dadc" />
  <text x="304" y="33" fill="white" font-size="7" font-family="system-ui,sans-serif" font-weight="700" text-anchor="middle">A</text>
  <circle cx="322" cy="30" r="8" fill="#e07a5f" />
  <text x="322" y="33" fill="white" font-size="7" font-family="system-ui,sans-serif" font-weight="700" text-anchor="middle">B</text>

  <!-- Skeleton title -->
  <rect x="76" y="54" width="140" height="8" rx="4" fill="#dbe7ea" />

  <!-- Skeleton lines -->
  <rect x="76" y="72" width="240" height="6" rx="3" fill="#e9f0f2" />
  <rect x="76" y="84" width="200" height="6" rx="3" fill="#e9f0f2" />
  <rect x="76" y="96" width="160" height="6" rx="3" fill="#e9f0f2" />
  <rect x="76" y="108" width="100" height="6" rx="3" fill="#e9f0f2" />

  <!-- Horizontal divider -->
  <line x1="72" y1="126" x2="328" y2="126" stroke="#dbe7ea" stroke-width="1" />

  <!-- Comment section label -->
  <text x="76" y="142" fill="#90a4ae" font-size="7" font-family="system-ui,sans-serif" font-weight="600">COMMENTS</text>

  <!-- User A comment -->
  <circle cx="84" cy="164" r="10" fill="#a8dadc" />
  <text x="84" y="167" fill="white" font-size="8" font-family="system-ui,sans-serif" font-weight="700" text-anchor="middle">A</text>
  <text x="102" y="167.5" fill="#3d5a6e" font-size="10" font-family="system-ui,sans-serif" font-weight="500">Consider target audience</text>

  <!-- User B comment -->
  <circle cx="84" cy="194" r="10" fill="#e07a5f" />
  <text x="84" y="197" fill="white" font-size="8" font-family="system-ui,sans-serif" font-weight="700" text-anchor="middle">B</text>
  <text x="102" y="197.5" fill="#3d5a6e" font-size="10" font-family="system-ui,sans-serif" font-weight="500">Refer the last month report</text>

  <!-- Comment input area -->
  <rect x="72" y="216" width="256" height="20" rx="6" fill="#f4f8f9" stroke="#dbe7ea" stroke-width="0.8" />
  <text x="82" y="229" fill="#b0bec5" font-size="8" font-family="system-ui,sans-serif">Add a comment...</text>
</svg>
